schema: spec-driven

context: |
  Product: platform-independent, owner-scoped long-term memory MCP service.
  Stack: Python 3.14, uv, MCP Python SDK, Pydantic, psycopg, PostgreSQL.
  Package: memory_mcp; Memory Core lives under memory_mcp.core and the
  authenticated transport/composition boundary lives under memory_mcp.server.
  Architecture: domain/application/ports do not depend on MCP, HTTP, database
  drivers, Agent SDKs, or runtime settings. PostgreSQL is the deployed authority;
  SQLite is a temporary behavioral baseline until PostgreSQL contract acceptance.
  Security: owner scope is derived only from authenticated server context.
  Conversation, candidate, memory, evidence, token, and secret text must not enter
  operational logs. Public tools never accept owner selectors.

rules:
  proposal:
    - Keep product scope, non-goals, and migration impact explicit.
  design:
    - Record dependency direction, transaction boundaries, and rejected alternatives.
    - Distinguish implemented behavior from planned behavior.
  specs:
    - Use exact external identifiers and stable error codes in backticks.
    - Include owner-isolation and sensitive-data negative scenarios.
  tasks:
    - Keep completion state evidence-based.
    - Put validation and rollback evidence in the same phase as implementation.
