[dependency-groups]
dev = [
    "memory-mcp",
    "memory-mcp-agent",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "unit: pure domain/function/rule tests with no I/O",
    "contract: Port protocol contract tests (Repository/Extractor/Profile/Guard)",
    "integration: cross-layer tests (MCP transport, PostgreSQL, transactions)",
    "evaluation: offline/live quality evaluation, not functional tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.per-file-target-version]
"agent/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv.workspace]
members = ["server", "agent"]

[tool.uv.sources]
memory-mcp = { workspace = true }
memory-mcp-agent = { workspace = true }
