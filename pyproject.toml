[project]
name = "agent-lab"
version = "0.1.0"
description = "An owner-scoped long-term memory service exposed through MCP"
readme = "README.md"
authors = [
    { name = "duanxiaosen", email = "duanxiaosen@chinaamc.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.1",
    "mcp==1.29.0",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
memory-mcp = "agent_lab.memory_mcp.server:main"
memory-db = "agent_lab.memory.adapters.postgresql.runtime:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
